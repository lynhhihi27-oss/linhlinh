<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dành cho người rảnh rỗi</title>
<style>
  :root { --bg:#f6f7fb; --card:#fff; --text:#1c1c28; --muted:#6b6b7b; --accent:#e63946; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14141c; --card:#1f1f2b; --text:#f1f1f6; --muted:#a0a0b2; }
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); }
  header { padding:28px 16px 12px; text-align:center; }
  header h1 { font-size:1.6rem; }
  header p { color:var(--muted); margin-top:6px; }
  .search { max-width:560px; margin:16px auto 0; padding:0 16px; }
  .search input { width:100%; padding:12px 16px; border-radius:999px; border:2px solid transparent;
    background:var(--card); color:var(--text); font-size:1rem; outline:none; }
  .search input:focus { border-color:var(--accent); }
  .chips { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; padding:14px 16px; }
  .chip { padding:6px 14px; border-radius:999px; border:none; cursor:pointer;
    background:var(--card); color:var(--text); font-size:.9rem; }
  .chip.active { background:var(--accent); color:#fff; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:16px;
    max-width:1100px; margin:0 auto; padding:8px 16px 40px; }
  .card { background:var(--card); border-radius:14px; overflow:hidden; cursor:pointer;
    transition:transform .15s; }
  .card:hover { transform:translateY(-4px); }
  .thumb { aspect-ratio:16/9; display:flex; align-items:center; justify-content:center;
    font-size:2.6rem; color:#fff; }
  .info { padding:12px; }
  .info h3 { font-size:.98rem; line-height:1.3; }
  .info span { display:inline-block; margin-top:8px; font-size:.78rem; color:var(--muted); }
  .empty { text-align:center; color:var(--muted); padding:40px 16px; display:none; }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.8); display:none;
    align-items:center; justify-content:center; padding:16px; z-index:10; }
  .modal.open { display:flex; }
  .modal-box { width:100%; max-width:760px; }
  .modal iframe { width:100%; aspect-ratio:16/9; border:0; border-radius:12px; }
  .close { display:block; margin:0 0 8px auto; background:none; border:none;
    color:#fff; font-size:1.6rem; cursor:pointer; }
</style>
</head>
<body>

<header>
  <h1>🔥 Dành cho người rảnh rỗi</h1>
  <p>Video xu hướng để giết thời gian</p>
</header>

<div class="search">
  <input id="q" type="search" placeholder="Tìm video... (vd: mukbang, asmr)">
</div>
<div class="chips" id="chips"></div>
<div class="grid" id="grid"></div>
<p class="empty" id="empty">Không tìm thấy video nào 😢</p>

<div class="modal" id="modal">
  <div class="modal-box">
    <button class="close" id="close">✕</button>
    <iframe id="player" allow="autoplay; encrypted-media" allowfullscreen></iframe>
  </div>
</div>

<script>
// Mỗi video: title, category, emoji, color, id (ID video YouTube, để trống cũng được)
// Có id  -> mở trình phát ngay trong trang
// Không id -> mở kết quả tìm kiếm YouTube theo tiêu đề
const videos = [
  { title:"Thử thách 24 giờ không dùng điện thoại", category:"Thử thách", emoji:"📵", color:"#e76f51", id:"" },
  { title:"Thử thách ăn cay cấp độ 10", category:"Thử thách", emoji:"🌶️", color:"#d62828", id:"" },
  { title:"Thử thách im lặng 1 ngày", category:"Thử thách", emoji:"🤫", color:"#6a4c93", id:"" },
  { title:"Mukbang gà rán cả nhà ăn không hết", category:"Ăn uống", emoji:"🍗", color:"#f4a261", id:"" },
  { title:"Review quán ăn vặt hot nhất tuần", category:"Ăn uống", emoji:"🍜", color:"#e9a23b", id:"" },
  { title:"Làm trà sữa tại nhà siêu dễ", category:"Ăn uống", emoji:"🧋", color:"#b08968", id:"" },
  { title:"ASMR tiếng mưa rơi thư giãn", category:"Thư giãn", emoji:"🌧️", color:"#457b9d", id:"" },
  { title:"Nhạc lofi học bài và làm việc", category:"Thư giãn", emoji:"🎧", color:"#5e60ce", id:"" },
  { title:"Thiền 10 phút giảm căng thẳng", category:"Thư giãn", emoji:"🧘", color:"#2a9d8f", id:"" },
  { title:"Vlog một ngày sống ở Sài Gòn", category:"Vlog", emoji:"🏙️", color:"#264653", id:"" },
  { title:"Vlog du lịch Đà Lạt 3 ngày 2 đêm", category:"Vlog", emoji:"⛰️", color:"#52b788", id:"" },
  { title:"Một ngày của sinh viên năm cuối", category:"Vlog", emoji:"🎓", color:"#3a86ff", id:"" },
  { title:"Đố vui hại não: bạn đoán được mấy câu?", category:"Đố vui", emoji:"🧠", color:"#8338ec", id:"" },
  { title:"Trắc nghiệm tính cách qua hình ảnh", category:"Đố vui", emoji:"🔮", color:"#9d4edd", id:"" },
  { title:"Đoán tên bài hát qua 3 giây", category:"Đố vui", emoji:"🎵", color:"#ff006e", id:"" },
  { title:"Tổng hợp video hài hước nhất tuần", category:"Hài hước", emoji:"😂", color:"#ffb703", id:"" },
  { title:"Những tình huống dở khóc dở cười", category:"Hài hước", emoji:"🤣", color:"#fb8500", id:"" },
  { title:"Thú cưng làm trò cực đáng yêu", category:"Hài hước", emoji:"🐶", color:"#e5989b", id:"" },
  { title:"Tóm tắt phim hay trong 10 phút", category:"Phim & Truyện", emoji:"🎬", color:"#3d405b", id:"" },
  { title:"Truyện kể bí ẩn lúc nửa đêm", category:"Phim & Truyện", emoji:"👻", color:"#495057", id:"" }
];

const grid = document.getElementById("grid");
const chipsBox = document.getElementById("chips");
const q = document.getElementById("q");
const empty = document.getElementById("empty");
let activeCat = "Tất cả";

// Bỏ dấu tiếng Việt để tìm "mukbang" hay "thu thach" đều ra
function norm(s) {
  return s.toLowerCase().normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d");
}

function render() {
  const key = norm(q.value.trim());
  const list = videos.filter(v =>
    (activeCat === "Tất cả" || v.category === activeCat) &&
    (norm(v.title).includes(key) || norm(v.category).includes(key))
  );
  grid.innerHTML = "";
  list.forEach(v => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML =
      '<div class="thumb" style="background:' + v.color + '">' + v.emoji + '</div>' +
      '<div class="info"><h3></h3><span></span></div>';
    card.querySelector("h3").textContent = v.title;
    card.querySelector("span").textContent = v.category;
    card.onclick = () => openVideo(v);
    grid.appendChild(card);
  });
  empty.style.display = list.length ? "none" : "block";
}

function renderChips() {
  const cats = ["Tất cả", ...new Set(videos.map(v => v.category))];
  cats.forEach(c => {
    const b = document.createElement("button");
    b.className = "chip" + (c === activeCat ? " active" : "");
    b.textContent = c;
    b.onclick = () => {
      activeCat = c;
      document.querySelectorAll(".chip").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
      render();
    };
    chipsBox.appendChild(b);
  });
}

const modal = document.getElementById("modal");
const player = document.getElementById("player");

function openVideo(v) {
  if (v.id) {
    player.src = "https://www.youtube.com/embed/" + v.id + "?autoplay=1";
    modal.classList.add("open");
  } else {
    window.open("https://www.youtube.com/results?search_query=" +
      encodeURIComponent(v.title), "_blank");
  }
}
function closeVideo() { modal.classList.remove("open"); player.src = ""; }
document.getElementById("close").onclick = closeVideo;
modal.onclick = e => { if (e.target === modal) closeVideo(); };

q.addEventListener("input", render);
renderChips();
render();
</script>
</body>
</html>
